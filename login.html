<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<title>Login</title>
</head>
<body>
<div class="container">
  <div class="card auth-card p-4">
    <h1 class="brand h4 mb-3">Welcome back</h1>
    <div id="alert" class="alert d-none" role="alert"></div>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="identity">Username or email</label>
        <input type="text" class="form-control" id="identity" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="text-center mt-3 mb-0">New here? <a href="register.html">Create an account</a></p>
  </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<title>My Profile</title>
</head>
<body>
<div class="container">
  <div class="card profile-card p-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
      <div class="d-flex align-items-center gap-3">
        <div class="avatar" id="avatar">?</div>
        <div>
          <h1 class="h4 mb-0" id="displayName">Loading...</h1>
          <small class="text-muted" id="displayEmail"></small>
        </div>
      </div>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
    </div>
    <div id="interestBadges" class="mb-3"></div>
    <div id="alert" class="alert d-none" role="alert"></div>
    <form id="profileForm" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="name">Full name</label>
          <input type="text" class="form-control" id="name" maxlength="80">
        </div>
        <div class="col-md-3">
          <label class="form-label" for="age">Age</label>
          <input type="number" class="form-control" id="age" min="1" max="120">
        </div>
        <div class="col-md-3">
          <label class="form-label" for="dob">Date of birth</label>
          <input type="date" class="form-control" id="dob">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="contact">Contact number</label>
          <input type="tel" class="form-control" id="contact" maxlength="20">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="interests">Interests <small class="text-muted">(comma separated)</small></label>
          <input type="text" class="form-control" id="interests" placeholder="coding, music, travel">
        </div>
        <div class="col-12">
          <label class="form-label" for="bio">Bio</label>
          <textarea class="form-control" id="bio" rows="3" maxlength="500"></textarea>
        </div>
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary mt-3">Save profile</button>
    </form>
  </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/profile.js"></script>
</body>
</html>

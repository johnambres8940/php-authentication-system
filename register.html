<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<title>Register</title>
</head>
<body>
<div class="container">
  <div class="card auth-card p-4">
    <h1 class="brand h4 mb-3">Create account</h1>
    <div id="alert" class="alert d-none" role="alert"></div>
    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input type="text" class="form-control" id="username" maxlength="30" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" minlength="8" autocomplete="new-password" required>
        <div class="form-text">Minimum 8 characters.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm">Confirm password</label>
        <input type="password" class="form-control" id="confirm" autocomplete="new-password" required>
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary w-100">Register</button>
    </form>
    <p class="text-center mt-3 mb-0">Already registered? <a href="login.html">Log in</a></p>
  </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/register.js"></script>
</body>
</html>
